#
# Builds the full Console Five Pro app (native FEX/Vulkan core + Kotlin UI), signs the release APK
# with the repository's dedicated key and publishes both APKs to a GitHub Release on tags.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of the release .jks/.keystore file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       private-key password (same as keystore password for PKCS12)

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# Superseded main-branch builds are cancelled automatically; tag builds get a
# unique group per tag and are never cancelled by each other or by main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native core + APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout (full history so git describe finds tags)
        # Pinned to a commit SHA; Dependabot (.github/dependabot.yml) opens the bump PRs.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components (NDK 28.2, CMake 3.31.6)
        run: |
          set -euo pipefail
          # The ubuntu-latest runner image ships the SDK with cmdline-tools preinstalled;
          # android-actions/setup-android is not used (it fails on the retired 'tools' package).
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; cmdline-tools contents:" >&2
            ls "$ANDROID_HOME/cmdline-tools/" >&2 || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"

      - name: Install Ninja and glslang
        run: sudo apt-get -y update && sudo apt-get -y install ninja-build glslang-tools

      - name: Configure native build
        run: |
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          [ -x "$CMAKE" ] || CMAKE="cmake"
          "$CMAKE" -S core -B build-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DKYTY_BUILD_LAUNCHER=OFF \
            -DGIT_EXECUTABLE=git

      - name: Build libcapyps5.so
        run: ninja -C build-android-arm64 capyps5

      - name: Stage jniLibs (strip + adrenotools hooks + libc++)
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          "$STRIP" --strip-debug -o "$JNI/libcapyps5.so" build-android-arm64/libcapyps5.so
          cp -f "$LIBCXX" "$JNI/libc++_shared.so"
          # libadrenotools hooks must sit in nativeLibraryDir to load custom GPU drivers.
          for HOOK in main_hook file_redirect_hook gsl_alloc_hook hook_impl; do
            SRC="$(find build-android-arm64 -name "lib$HOOK.so" -print -quit)"
            if [ -z "$SRC" ]; then echo "missing lib$HOOK.so" >&2; exit 1; fi
            "$STRIP" --strip-debug -o "$JNI/lib$HOOK.so" "$SRC"
          done
          ls -la "$JNI"

      - name: Verify 16 KB alignment and non-execstack (Android 15+/16 devices)
        run: |
          set -euo pipefail
          # The NDK's llvm-readelf exits 74 on the stripped 28 MB core library (it parses
          # the 9 MB prebuilt libc++_shared.so fine); GNU readelf handles both reliably
          # and is preinstalled on the runner.
          READELF="$(command -v readelf)"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          fail=0
          for SO in "$JNI"/*.so; do
            name=$(basename "$SO")
            headers="$(mktemp)"
            if ! "$READELF" -lW "$SO" > "$headers" 2>&1; then
              rc=$?
              echo "::error::$name: readelf failed (rc=$rc)"
              head -5 "$headers" || true
              rm -f "$headers"
              fail=1
              continue
            fi
            align_hex="$(awk '$1=="LOAD" {print $NF; exit}' "$headers")"
            align_dec=$((align_hex))
            if [ "${align_dec:-0}" -lt 16384 ]; then
              echo "::error::$name LOAD alignment is $align_hex (expected >= 0x4000)"
              fail=1
            else
              echo "$name: LOAD aligned to $align_dec bytes"
            fi
            if grep -q 'GNU_STACK.*RWE' "$headers"; then
              echo "::error::$name requests an executable stack (GNU_STACK RWE)"
              fail=1
            else
              echo "$name: GNU_STACK is non-executable"
            fi
            rm -f "$headers"
          done
          exit $fail

      - name: Upload staged native libraries (when the gate fails)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-jnilibs-failed-gate
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: ignore

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs (debug + release)
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --console=plain --no-daemon --stacktrace

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          echo "Building release for version $VERSION"
          mkdir -p dist
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "dist/ConsoleFivePro-v${VERSION}-release.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs "dist/ConsoleFivePro-v${VERSION}-release.apk" | head -5
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ConsoleFivePro-v${VERSION}-debug.apk"
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ConsoleFivePro-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          TAG="${GITHUB_REF_NAME}"
          cat > /tmp/release_notes.md <<'NOTES'
          **Console Five Pro v0.0.8proplus** — an independent rebranded build of CapyPS5 v0.0.3, the first PlayStation 5 emulator for Android (built on KytyPS5 and the FEX x86-64 JIT).

          ## New in v0.0.8proplus — driver compatibility, per-game saves, screen format

          - **Custom Vulkan drivers no longer fail at startup (status 321)**: Turnip and PanVk lack some optional Vulkan features, and requesting them used to make vkCreateDevice fail before the first frame. Optional features are now requested only when the driver reports them, samplers fall back to plain filtering without anisotropy, and a warning lists whatever the driver is missing.
          - **Game imports are validated**: picking a .pkg or any non-executable used to freeze the app for minutes while it copied, and then fail to boot. Files are now checked for the ELF/SELF executable magic before a byte is written, free space is verified, and a card shows the import progress.
          - **Per-game save export and import**: each game's options panel has its own export/import rows, so a save can be moved without knowing which title id it belongs to (also reads that game's folder out of a full-export zip).
          - **Screen format setting**: Default (full screen), 16:9 or 5:4 letterboxing, applied live while playing (Settings → Graphics).
          - **The Settings sidebar scrolls on small screens**, so the About entry is always reachable.
          - **Clearer crash reports**: a null-pointer crash inside the game's own code is now reported as a game-side crash — like it would behave on console — instead of a raw host exception.

          ## From v0.0.8pro — the stability release: crashes fixed, auto-save, saves import/export

          ### Crash fixes (status-321 exits, freezes and native crashes)

          - **Malformed GPU packets no longer kill the emulator**: the const-RAM out-of-bounds write (up to 48 KB past the buffer) is bounded, and both PM4 parsers reject bad packets gracefully instead of hitting EXIT_NOT_IMPLEMENTED — a corrupt or edge-case command buffer now logs one diagnostic and continues.
          - **Corrupted / truncated ELF and SELF images fail cleanly**: every Seek/Read result in the loader is verified (a truncated file used to parse as zeros), table reads are bounds-checked, `Elf64::Save` no longer dereferences a null section table on SELF images, and dynamic-linker tables and relocation targets are validated before use.
          - **Cheat and param files abort the process load, not the emulator**: malformed cheat data is rejected without exceptions (the core builds with `-fno-exceptions`), and a bad param.sfo no longer takes the app down.
          - **Guest page faults resolve on a dedicated fault thread**: the old path took locks and logged from inside the SIGSEGV handler, which self-deadlocked when the faulting thread held one of those locks; now the handler only queues the fault and a worker performs the cache invalidation.
          - **Thread lifecycle races closed**: reference-counted file descriptors (use-after-free, racing close), thread-safe lazy singleton initialization, a synchronized stubbed-import registry, serialized game-patch state, and second game launch no longer `std::terminate`s.
          - **Destroying a still-running host thread no longer terminates the emulator**, and the Windows high-resolution-timer HANDLE leak is closed.
          - **Unreal Engine games no longer die at boot with LowLevelFatalError (sceKernelBatchMap 0x8002000c)**: memory reserved through the kernel memory pool (sceKernelMemoryPoolExpand — e.g. Enotria) is now a legal direct-memory source. Borrowed pool pages cannot be double-owned by a pool commit, are returned when the last direct view goes away, and pool expansion release keeps working unchanged.
          - **A slow detached thread can no longer stall new thread creation**: the reaper joins outside the pool mutex.
          - **Config reads outside the config lifetime fall back to defaults** instead of dereferencing null.
          - **`PthreadJoin` writes the exit value through a verified-writable pointer**, reporting EFAULT like the real kernel instead of SIGSEGV on a wild guest pointer.
          - **is_mapped no longer calls `feof` on a null FILE\*** when /proc is unavailable.
          - **The desktop launcher's update download no longer divides by zero** (SIGFPE) when a release size is unknown.

          ### Data safety

          - **Writes larger than 4 GiB are chunked and completed** — previously rejected with EINVAL or silently narrowed to 32 bits on the iovec path.
          - **Auto-save**: a zip snapshot of `_SaveData` per game every 5 minutes and on exit (3 newest kept), with a Settings toggle and an "Auto-saved HH:mm" line in the pause menu.
          - **Import / export all game saves as one zip** (Settings → Game saves), with traversal and size guards — move your progress between devices.

          ### Android

          - **Exit button fixed**: confirming Exit in the pause menu now really exits on the second tap — touch users no longer need the gamepad Confirm key.
          - **Synchronized, reference-counted native-window hand-off**: detaching the view while the emulator builds its Vulkan surface can no longer use-after-free the window.
          - **Build hardening**: ffmpeg prebuilt zips are pinned to SHA-256 and mirrored in-repo (no more build breakage when the upstream release moves), actions pinned to commit SHAs.

          ## Carried over from v0.0.7pro

          Own package name `com.consolefivepro`, Present mode setting (Mailbox / VSync / Uncapped), big-core pipeline workers, sequential-read game files, and the Vulkan device-selection fixes (Adreno 740 driver-676 and Turnip a660 logs).

          ## Requirements

          - Android 12 or later, arm64 device, Vulkan 1.3 GPU.
          - 12 GB of RAM recommended.
          - Your own PS5 game dumps (a folder with `eboot.bin` and `sce_sys/`).

          **Console Five Pro includes no games, BIOS, firmware or Sony keys, and needs none of them.** Not affiliated with Sony Interactive Entertainment; PlayStation and PS5 are trademarks of their respective owners.

          ## Credits

          - Upstream **CapyPS5 v0.0.3** by Ghael-V; this project is an independent rebranded build of it.
          - KytyPS5 and the original Kyty by InoriRus, and the FEX project.

          License: **GPL-2.0-only** — full source: https://github.com/maxi000q/ConsoleFivePro (tag: v0.0.8proplus)
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "Console Five Pro v${VERSION}" \
              --notes-file /tmp/release_notes.md
          fi
          gh release view "$TAG" --json name,assets --jq '{name: .name, assets: [.assets[].name]}'
