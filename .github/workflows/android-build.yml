#
# Builds the full Console Five Pro app (native FEX/Vulkan core + Kotlin UI), signs the release APK
# with the repository's dedicated key and publishes both APKs to a GitHub Release on tags.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of the release .jks/.keystore file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       private-key password (same as keystore password for PKCS12)

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# Superseded main-branch builds are cancelled automatically; tag builds get a
# unique group per tag and are never cancelled by each other or by main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native core + APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout (full history so git describe finds tags)
        # Pinned to a commit SHA; Dependabot (.github/dependabot.yml) opens the bump PRs.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components (NDK 28.2, CMake 3.31.6)
        run: |
          set -euo pipefail
          # The ubuntu-latest runner image ships the SDK with cmdline-tools preinstalled;
          # android-actions/setup-android is not used (it fails on the retired 'tools' package).
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; cmdline-tools contents:" >&2
            ls "$ANDROID_HOME/cmdline-tools/" >&2 || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"

      - name: Install Ninja and glslang
        run: sudo apt-get -y update && sudo apt-get -y install ninja-build glslang-tools

      - name: Configure native build
        run: |
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          [ -x "$CMAKE" ] || CMAKE="cmake"
          "$CMAKE" -S core -B build-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DKYTY_BUILD_LAUNCHER=OFF \
            -DGIT_EXECUTABLE=git

      - name: Build libcapyps5.so
        run: ninja -C build-android-arm64 capyps5

      - name: Stage jniLibs (strip + adrenotools hooks + libc++)
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          "$STRIP" --strip-debug -o "$JNI/libcapyps5.so" build-android-arm64/libcapyps5.so
          cp -f "$LIBCXX" "$JNI/libc++_shared.so"
          # libadrenotools hooks must sit in nativeLibraryDir to load custom GPU drivers.
          for HOOK in main_hook file_redirect_hook gsl_alloc_hook hook_impl; do
            SRC="$(find build-android-arm64 -name "lib$HOOK.so" -print -quit)"
            if [ -z "$SRC" ]; then echo "missing lib$HOOK.so" >&2; exit 1; fi
            "$STRIP" --strip-debug -o "$JNI/lib$HOOK.so" "$SRC"
          done
          ls -la "$JNI"

      - name: Verify 16 KB alignment and non-execstack (Android 15+/16 devices)
        run: |
          set -euo pipefail
          # The NDK's llvm-readelf exits 74 on the stripped 28 MB core library (it parses
          # the 9 MB prebuilt libc++_shared.so fine); GNU readelf handles both reliably
          # and is preinstalled on the runner.
          READELF="$(command -v readelf)"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          fail=0
          for SO in "$JNI"/*.so; do
            name=$(basename "$SO")
            headers="$(mktemp)"
            if ! "$READELF" -lW "$SO" > "$headers" 2>&1; then
              rc=$?
              echo "::error::$name: readelf failed (rc=$rc)"
              head -5 "$headers" || true
              rm -f "$headers"
              fail=1
              continue
            fi
            align_hex="$(awk '$1=="LOAD" {print $NF; exit}' "$headers")"
            align_dec=$((align_hex))
            if [ "${align_dec:-0}" -lt 16384 ]; then
              echo "::error::$name LOAD alignment is $align_hex (expected >= 0x4000)"
              fail=1
            else
              echo "$name: LOAD aligned to $align_dec bytes"
            fi
            if grep -q 'GNU_STACK.*RWE' "$headers"; then
              echo "::error::$name requests an executable stack (GNU_STACK RWE)"
              fail=1
            else
              echo "$name: GNU_STACK is non-executable"
            fi
            rm -f "$headers"
          done
          exit $fail

      - name: Upload staged native libraries (when the gate fails)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-jnilibs-failed-gate
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: ignore

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs (debug + release)
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --console=plain --no-daemon --stacktrace

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          echo "Building release for version $VERSION"
          mkdir -p dist
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "dist/ConsoleFivePro-v${VERSION}-release.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs "dist/ConsoleFivePro-v${VERSION}-release.apk" | head -5
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ConsoleFivePro-v${VERSION}-debug.apk"
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ConsoleFivePro-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          TAG="${GITHUB_REF_NAME}"
          cat > /tmp/release_notes.md <<'NOTES'
          **Console Five Pro v0.0.9proQ3** — an independent rebranded build of CapyPS5 v0.0.3, the first PlayStation 5 emulator for Android (built on KytyPS5 and the FEX x86-64 JIT).

          ## v0.0.9proQ3 — Graphics API option, shader optimizer, crash fix, the Mali regression and the frame-drop round (same graphics)

          - **New: Graphics API setting (Vulkan / OpenGL ES) — the compatibility backend.** Settings → Graphics (also per game). Vulkan remains the default: it renders and presents directly, the fastest path. The new OpenGL ES mode is for devices whose Vulkan present path is broken while offscreen Vulkan and EGL work: the final frame is drawn into a 3-image AHardwareBuffer ring (`VK_ANDROID_external_memory_android_hardware_buffer`) and a fully runtime-loaded EGL/GLES renderer (no build-time EGL dependency) presents it to the same SurfaceView — same pixels. Frames stay in the UNORM variant of the guest format so sRGB-encoded bytes reach the screen untouched. The core falls back to the Vulkan swapchain automatically when the device lacks AHardwareBuffer import, EGL fails at runtime, or after five present failures; the Vulkan path is untouched while the setting stays on Vulkan (`debug.capy.gl_backend`).
          - **Faster: every translated shader now runs through a per-vendor spirv-opt pass list** (Mali/PanVK: the full list; Adreno/Turnip: the local cleanups) before it reaches the driver: dead branches and dead code, insert/extract chains, redundant local loads/stores, duplicate constants and dead vector lanes disappear, then ids compact. The pass list is interface-preserving (entry points, bindings, push constants untouched) and the optimized module is validated before it replaces the original — on any failure the known-good original is kept. Arm's SPIR-V front end is the slowest of the mobile compilers: smaller, simpler modules mean pipeline compiles finish sooner (fewer first-visit hitches, shorter shader-storm warm-ups) and better generated code. `debug.capy.spirv_opt`: 0 off, 1 on for every vendor, 2 auto (the default; on for Arm and Qualcomm).
          - **Faster: emulated mesh draws (heavy 3D titles).** Mesh-shader emulation zero-fills its index buffer between the previous draw's reads and the next dispatch — the barrier around it was a full-pipeline AllCommands stall, once per emulated mesh draw, and heavy scenes run dozens of them per frame. The barrier now covers exactly the accesses the mesh buffer has: earlier draws' vertex/index reads and the dispatch's compute writes, so unrelated in-flight fragment work keeps flowing on both Snapdragon and Mali.
          - **Fixed: the crash from the latest report.** A Unity-engine title could die the moment the window lost focus (switching apps, opening the volume menu): its graphics worker read through a torn pointer into a never-mapped hole of the guest address space (one page above the low reservation floor). Reads whose whole access lies in a hole no guest mapping covers now return zero — the hole cannot hold game data — using the same proven plain-load decoder as the null-page recovery, budget-capped. `debug.capy.wild_read_recovery=0` restores the old behaviour.
          - **Hardened: the crash recoveries can no longer be starved.** All three guest-fault recoveries (null-page reads, wild reads into unmapped holes, wild stores) previously shared a fixed budget of 64 per session - a game whose worker trips a recovered fault once per frame spent it in about a minute, and fault #65 then killed a session the game was coping with. The budget is now per faulting instruction and time-based: the same instruction faulting in a tight loop (microseconds apart) is still cut off after 256 repeats with the honest crash report, while faults spaced like frames (1 ms apart or more) reset their counter and are recovered for the whole session. A 1M per-path valve remains against pathological fault storms.
          - **Fixed: the Mali performance regression and heavy drops.** The Q2 refresh unlock ran the emulated vblank at the display's maximum (120 Hz on most phones): the present thread woke 240x/s, took the driver-wide and per-port locks on every tick, and every guest vblank waiter woke twice per frame — pure overhead while the game could not even fill 60 FPS. An adaptive governor now paces the emulated vblank at 60 Hz and unlocks to the configured rate only while the game sustains 55+ flips/s (two one-second windows), falling back below 50. Games that earn high refresh keep every frame of it; mode queries still report the configured rate. `debug.capy.vblank_governor=0` pins the configured rate.
          - **Faster vblank tick (every GPU).** Per-port interest counters now gate the vblank/flip event triggers (an empty registration queue used to be copied on every tick — 60-120x/s per open port — plus one weak_ptr lock per registration) and the waiterless `SignalAll` (a futex syscall per port per tick). Firing into an empty queue was always a no-op; now it is a skip. Over-counts only ever keep the slow path. `debug.capy.vblank_fastpath=0` restores unconditional triggers. The present thread also joined the big-core pinning of the emulator/GPU threads, and closing a video port now wakes its vblank waiters (a waiter on a closing port could previously sleep forever).
          - **Fixed: memory-stall frame drops.** Guest memory is backed by 4 KiB pages on Android again — under the allocation pressure a heavy game creates, a 2 MiB huge-page fault could stall for milliseconds in synchronous kernel compaction, the signature of the "many drops" reports on 8 GB devices. Desktop builds keep huge pages; `setprop debug.capy.thp 1` re-enables them on Android. Mali also returns to the 256 KB GPU-download read-ahead window (bandwidth-bound; Adreno keeps 512 KB).
          - Same graphics everywhere: every change is pacing, overhead or recovery — not a single pixel is drawn differently, and every new default is guarded by a `debug.capy.*` property.

          ## v0.0.9proQ2 — heavy-game crash fix, 90/120 Hz unlock, hot-pipeline compilation, deeper Snapdragon + Mali profiles (same graphics)

          - **Fixed: heavy Unreal Engine titles no longer crash seconds into gameplay.** GPU-driven draw batches (DrawIndirectMulti) read their draw counts and argument buffers from game memory that the game is free to release; a read that landed on freed memory faulted inside libc and ended the session with "Unhandled host exception ... in DrawIndirectMulti". Every such guest read is now guarded: the count goes through the fault-safe reader, and the two raw copies of the guest read path run behind a fault guard that unwinds cleanly - a batch whose arguments vanished is skipped, exactly like a real GPU reading zero from an unmapped address, and the page is evicted from the thread's cache so the next read probes instead of faulting. GPU-tracker-protected pages still download and resume first; only truly unreadable memory takes the recovery. `debug.capy.guarded_reads=0` restores the raw copies. The mechanism is covered by a standalone 11-check test (mapped copy, clean failure on freed memory, guard reuse after longjmp, tracker-first recovery, outside-range faults still reported).
          - **New: the 60 FPS ceiling is gone (90/120 Hz displays).** The emulated vblank was hard-wired to 60 Hz, and the present thread flips at most once per vblank - every game paced on vblank was capped at 60 FPS even on high-refresh screens, and the Android window never asked for its high mode. A new per-game **Refresh rate** option (Settings → Performance, Auto by default) now: selects the display's fastest mode for the game window (`preferredDisplayModeId`), adds a `setFrameRate` vote on the game surface (API 30+), and passes the same rate to the core as the emulated vblank (`debug.capy.vblank_hz`). Same graphics; games that pace internally are unaffected.
          - **New: Adreno GPU optimization profile (Auto on Snapdragon, including under Turnip).** `debug.capy.adreno_profile`: a 128 MB streaming buffer (streaming-heavy games wait on the GPU less), one extra pipeline-compile worker (open drivers compile slower than Qualcomm's proprietary one, so Unreal's material streaming hitches less), and one extra swapchain image so MAILBOX presenting never throttles `vkAcquireNextImageKHR` at 90/120 Hz (`debug.capy.swapchain_extra` overrides). The Vulkan driver is now queried (`VkPhysicalDeviceDriverProperties`), recorded (open-driver detection) and logged at startup.
          - **New: hot-pipeline compilation - the biggest warm-up win for heavy games (every GPU).** The async pipeline queue was FIFO: during a material-streaming storm, hundreds of one-shot pipelines queued ahead of the handful the game was actively drawing with, so draws were skipped and heavy titles crawled exactly when they were loading (the "7 FPS with severe stutter" symptom). Every re-request of a still-pending pipeline now raises its priority, and workers compile the hottest job first (ties: oldest). `debug.capy.hot_pipelines=0` restores FIFO.
          - **Deeper both-GPU profile work:** queue submissions batch up to **16** deep on Mali/Adreno (was 8 - every `vkQueueSubmit` carries fixed driver+kernel overhead that dominates at single-digit FPS), the per-thread guest read cache grows from 2 MB to **16 MB of coverage** under the GPU profiles (`debug.capy.read_cache_slots`; Unreal's shader resource walker reads gigabytes of scattered descriptors, and every cache hit skips a `process_vm_readv` syscall), and GPU download read-ahead widens from 256 KB to **512 KB** (`debug.capy.read_ahead_kb`).
          - All of it is same-graphics: AFBC/UBWC compression stays lossless, and every new default is guarded by a `debug.capy.*` property that restores the previous behaviour.

          ## v0.0.9proQ1 — crash fixes, import/storage fixes + much deeper GPU optimization (same graphics)

          - **Fixed: the app could crash right after importing a game.** Importing the same executable twice (typically a retry after the game crashed) added two library entries with the same key, which the game grid cannot render — the app died with "Key ... was already used". Imports now run one at a time (a second pick while a multi-GB copy is still running no longer races the first), a completed import reuses the existing library entry instead of adding a twin, and the grid list itself is deduplicated as a last line of defence.
          - **Fixed: a one-off null-pointer read inside the game no longer ends the session.** The v0.0.9pro crash on Mali phones ("the game itself crashed: null-pointer read") now recovers instead: Android cannot map the null page (mmap_min_addr), so the faulting A64 load is decoded in the signal handler, its destination register receives zero — what a zeroed page would return — and execution resumes past it. Reads only (writes are never faked), capped at 64 recoveries per session so a genuine null-dereference loop still fails; `debug.capy.null_read_recovery=0` restores the previous behaviour.
          - **Faster, more responsive imports.** The copy buffer grows from 64 KB to 1 MB and the progress card redraws once per percent instead of once per chunk (a 7 GB import recomposed it over 100,000 times). Picking a real `.pkg` now explains what to import (the extracted game folder or its eboot.bin) instead of a generic "not a game" rejection.
          - **Fixed: large game imports no longer eat the whole disk.** Importing a 7 GB eboot used to copy into internal storage (while the library lives on shared storage), leave a partial multi-GB file behind on every failed retry, and skip the space check entirely when the file provider reported no size — so a 7 GB game "needed" 17+ GB and then failed with "not enough space". Imports now land in the library's own `imported` folder, are staged as `.part` and published by rename (a half-written file can never be booted), every failure deletes its partial file, leftovers from older versions are swept automatically on start, and free space is verified up front and re-checked every 256 MB while copying.
          - **Deeper Mali optimization — AFBC stays alive on render targets (the big one).** Every colour render target was created with an open-ended mutable-format list, which forces Mali drivers to disable AFBC (Arm Frame Buffer Compression) — the lossless compressor that halves render-target memory traffic. Targets are now created with a single-format view list so AFBC (and UBWC on Adreno) stays active. Games that reinterpret target memory (writing RGBA16F and reading it back as R32G32, the classic post-processing pattern) trigger a one-time in-place recreation with the contents copied — pixel-identical, no corruption — and that memory is remembered so its images are created fully mutable from then on. On a bandwidth-bound Mali this is the single largest same-graphics win available; combined with v0.0.9pro's pass and barrier work it targets another large FPS step on Mali-G76-class devices.
          - **Async-compute batching.** Unity and Unreal titles interleave many small async-compute batches with graphics; each one used to end the command buffer (one `vkQueueSubmit` per batch). Compute now follows the same drain policy as graphics: while more work is queued, recording continues in the same command buffer. Explicit sync points (EOP events, flips, waits) still flush immediately. Fewer submissions per frame = less driver and kernel overhead on every GPU.
          - **1:1 present path.** When the game's frame already matches the screen exactly (native resolution, 100% scale), the output stage takes a plain `vkCmdCopyImage` instead of a sampler-driven scaled blit — cheaper on every GPU, identical pixels.
          - All of it is same-graphics: AFBC/UBWC are lossless, and every new path is guarded by debug properties (`debug.capy.rt_format_list`, `debug.capy.batch_submits`) that restore the previous behaviour.

          ## From v0.0.9pro

          Mali GPU optimization with GPU detection (hardware render-target clears that keep AFBC alive, 128 MB streaming buffer, one more pipeline-compile worker), render passes no longer split by game events (hundreds fewer full render-target store+reload cycles per frame on tile-based GPUs), cache reclamation at a fixed cadence, more pipeline-compile workers, 96 MB streaming ring on non-Mali GPUs, scrollable per-game options panel.

          ## From v0.0.8proplus

          Custom Vulkan drivers (Turnip, PanVk) that lack optional features no longer fail at startup with status 321; game imports are validated up front with a progress card; per-game save export/import; screen-format setting (Default / 16:9 / 5:4); scrollable Settings sidebar; clearer game-side crash reports.

          ## From v0.0.8pro — the stability release

          Malformed GPU packets no longer kill the emulator; corrupted ELF/SELF images fail cleanly; guest page faults resolve on a dedicated fault thread; Unreal Engine games no longer die at boot with LowLevelFatalError (sceKernelBatchMap 0x8002000c, e.g. one Unreal Engine souls-like); auto-save snapshots; import/export all saves; exit button fix; build hardening.

          ## Requirements

          - Android 12 or later, arm64 device, Vulkan 1.3 GPU.
          - 12 GB of RAM recommended.
          - Your own PS5 game dumps (a folder with `eboot.bin` and `sce_sys/`).

          **Console Five Pro includes no games, BIOS, firmware or Sony keys, and needs none of them.** Not affiliated with Sony Interactive Entertainment; PlayStation and PS5 are trademarks of their respective owners.

          ## Credits

          - Upstream **CapyPS5 v0.0.3** by Ghael-V; this project is an independent rebranded build of it.
          - KytyPS5 and the original Kyty by InoriRus, and the FEX project.

          License: **GPL-2.0-only** — full source: https://github.com/maxi000q/ConsoleFivePro (tag: v0.0.9proQ3)
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "Console Five Pro v${VERSION}" \
              --notes-file /tmp/release_notes.md
          fi
          gh release view "$TAG" --json name,assets --jq '{name: .name, assets: [.assets[].name]}'
