#
# Builds the full Console Five Pro app (native FEX/Vulkan core + Kotlin UI), signs the release APK
# with the repository's dedicated key and publishes both APKs to a GitHub Release on tags.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of the release .jks/.keystore file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       private-key password (same as keystore password for PKCS12)

name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# Superseded main-branch builds are cancelled automatically; tag builds get a
# unique group per tag and are never cancelled by each other or by main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native core + APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout (full history so git describe finds tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components (NDK 28.2, CMake 3.31.6)
        run: |
          set -euo pipefail
          # The ubuntu-latest runner image ships the SDK with cmdline-tools preinstalled;
          # android-actions/setup-android is not used (it fails on the retired 'tools' package).
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; cmdline-tools contents:" >&2
            ls "$ANDROID_HOME/cmdline-tools/" >&2 || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"

      - name: Install Ninja and glslang
        run: sudo apt-get -y update && sudo apt-get -y install ninja-build glslang-tools

      - name: Configure native build
        run: |
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          [ -x "$CMAKE" ] || CMAKE="cmake"
          "$CMAKE" -S core -B build-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DKYTY_BUILD_LAUNCHER=OFF \
            -DGIT_EXECUTABLE=git

      - name: Build libcapyps5.so
        run: ninja -C build-android-arm64 capyps5

      - name: Stage jniLibs (strip + adrenotools hooks + libc++)
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          "$STRIP" --strip-debug -o "$JNI/libcapyps5.so" build-android-arm64/libcapyps5.so
          cp -f "$LIBCXX" "$JNI/libc++_shared.so"
          # libadrenotools hooks must sit in nativeLibraryDir to load custom GPU drivers.
          for HOOK in main_hook file_redirect_hook gsl_alloc_hook hook_impl; do
            SRC="$(find build-android-arm64 -name "lib$HOOK.so" -print -quit)"
            if [ -z "$SRC" ]; then echo "missing lib$HOOK.so" >&2; exit 1; fi
            "$STRIP" --strip-debug -o "$JNI/lib$HOOK.so" "$SRC"
          done
          ls -la "$JNI"

      - name: Verify 16 KB alignment and non-execstack (Android 15+/16 devices)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          fail=0
          for SO in "$JNI"/*.so; do
            name=$(basename "$SO")
            align_hex=$("$READELF" -lW "$SO" | awk '$1=="LOAD" {print $NF; exit}')
            align_dec=$((align_hex))
            if [ "${align_dec:-0}" -lt 16384 ]; then
              echo "::error::$name LOAD alignment is $align_hex (expected >= 0x4000)"
              fail=1
            else
              echo "$name: LOAD aligned to $align_dec bytes"
            fi
            if "$READELF" -lW "$SO" | grep -q 'GNU_STACK.*RWE'; then
              echo "::error::$name requests an executable stack (GNU_STACK RWE)"
              fail=1
            else
              echo "$name: GNU_STACK is non-executable"
            fi
          done
          exit $fail

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs (debug + release)
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --console=plain --no-daemon --stacktrace

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          echo "Building release for version $VERSION"
          mkdir -p dist
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "dist/ConsoleFivePro-v${VERSION}-release.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs "dist/ConsoleFivePro-v${VERSION}-release.apk" | head -5
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ConsoleFivePro-v${VERSION}-debug.apk"
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleFivePro-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)"
          TAG="${GITHUB_REF_NAME}"
          cat > /tmp/release_notes.md <<'NOTES'
          **Console Five Pro v0.0.6proplus** — an independent rebranded build of CapyPS5 v0.0.3, the first PlayStation 5 emulator for Android (built on KytyPS5 and the FEX x86-64 JIT).

          ## New in v0.0.6proplus — fixed-address crash fix, newest-device compatibility, adaptive resolution

          - **Fixed-address memory crash fixed**: games that map memory at high fixed addresses (My First Gran Turismo, and other titles on some devices) terminated the emulator with status 321. The host window such an address folds onto is now adopted on demand, fixed range reservations in the same band succeed again, and a stray guest write into an unmapped window is recovered with a zeroed page instead of closing the emulator.
          - **Newest-device compatibility**: every native library is linked with a non-executable stack (Android 16 denies execstack) and 16 KB-page-aligned LOAD segments (required by Android 15+ 16 KB-page hardware). Both properties are verified automatically on every CI build.
          - **New setting — Adaptive resolution** (Settings → Performance, default off): the render scale steps down while the game cannot hold its frame rate and recovers when there is headroom — live, without restarting the game. 30-fps-capped games never trigger it.
          - **Performance-core pinning**: the emulation and graphics threads, already running at raised priority, are now pinned to the big cores of big.LITTLE SoCs (best effort; toggle with `debug.capy.perf_cores`).
          - **Logcat hygiene**: unresolved-import and missing-file reports appear once per symbol/path instead of hundreds of times, and the backing-store startup line no longer prints a stale errno.

          ## Also inherited from v0.0.5proplus / v0.0.5pro / v0.0.4pro

          - Present-thread priority + 4 ms pacing, pipeline-cache count-flush, streaming-buffer setting, updater suffix-ordering fix.
          - FF7 Rebirth shader-crash fix (null-descriptor fallback), pad handle 0 input fix.
          - Console Five Pro rebrand, white icon, Discord community link in Settings; installs side by side with the original CapyPS5 (package id `org.consolefivepro.emulator`).

          ## Requirements

          - Android 12 or later, arm64 device, Vulkan 1.3 GPU.
          - 12 GB of RAM recommended.
          - Your own PS5 game dumps (a folder with `eboot.bin` and `sce_sys/`).

          **Console Five Pro includes no games, BIOS, firmware or Sony keys, and needs none of them.** Not affiliated with Sony Interactive Entertainment; PlayStation and PS5 are trademarks of their respective owners.

          ## Credits

          - Upstream **CapyPS5 v0.0.3** by Ghael-V; this project is an independent rebranded build of it.
          - KytyPS5 and the original Kyty by InoriRus, and the FEX project.

          License: **GPL-2.0-only** — full source: https://github.com/maxi000q/ConsoleFivePro (tag: v0.0.6proplus)
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "Console Five Pro v${VERSION}" \
              --notes-file /tmp/release_notes.md
          fi
          gh release view "$TAG" --json name,assets --jq '{name: .name, assets: [.assets[].name]}'
